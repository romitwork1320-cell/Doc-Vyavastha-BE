# Local dev stack: PostgreSQL + the Go API. `docker compose up` brings up a
# fully migrated + seeded backend reachable at http://localhost:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edconsultancy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc -d edconsultancy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://edc:edc@postgres:5432/edconsultancy?sslmode=disable
      AUTO_MIGRATE: "true"
      SEED_DEMO: "true"
      JWT_ACCESS_SECRET: dev-only-change-me-0123456789abcdef
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CLIENT_URL: http://localhost:4200
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
      EMAIL_SENDER: log
    ports:
      - "8080:8080"

volumes:
  pgdata:
